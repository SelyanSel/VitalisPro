<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitalis Pro - Espace Membre</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/cssfix.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-slate-100 min-h-screen w-full flex flex-row font-(family-name:--font-nunito) antialiased">

    <div id="content"
        class="backdrop-blur-sm bg-white/50 flex flex-1 flex-col p-5 m-5 rounded-2xl shadow-md border-2 border-stone-50">

        <div class="flex flex-1 flex-row gap-4 justify-center items-center">

            <div
                class="backdrop-blur-sm bg-white/50 flex flex-col p-5 m-5 rounded-2xl shadow-md border-2 gap-2 border-stone-50">

                <a class="text-xl font-extrabold" id="pagetitle">Nouveau compte</a>

                <a class="text-gray-500">Bienvenue ! Créez votre compte: entrez vos informations pour commencer.</a>

                <br>

                <input type="text" id="email" class="bg-neutral-secondary-medium border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand w-full px-3 py-2.5 placeholder:text-body
                            backdrop-blur-sm flex flex-1 flex-col rounded-2xl shadow-md border-2 border-stone-50"
                    placeholder="e-mail..." required />
                <input type="text" id="name" class="bg-neutral-secondary-medium border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand w-full px-3 py-2.5 placeholder:text-body
                            backdrop-blur-sm flex flex-1 flex-col rounded-2xl shadow-md border-2 border-stone-50"
                    placeholder="prénom..." required />
                <input type="text" id="password" class="bg-neutral-secondary-medium border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand w-full px-3 py-2.5 placeholder:text-body
                            backdrop-blur-sm flex flex-1 flex-col rounded-2xl shadow-md border-2 border-stone-50"
                    placeholder="mot de passe..." required />
                <input type="text" id="vPassword" class="bg-neutral-secondary-medium border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand w-full px-3 py-2.5 placeholder:text-body
                            backdrop-blur-sm flex flex-1 flex-col rounded-2xl shadow-md border-2 border-stone-50"
                    placeholder="confirmez le mot de passe..." required />
                <div id="btnLogin" onclick="newRegister()" class="bg-sky-950 p-2.5 mt-4 rounded-2xl cursor-pointer shadow-md border-2 border-sky-900 flex flex-row gap-3
                                   items-center align-middle">
                    <img class="h-5" src="../assets/img/verify.png">
                    <a class="text-white">Valider</a>
                </div>
                <br>
                <a class="text-gray-700">Déjà un compte? <a href="../login.html" class="text-sky-600 underline">Cliquez ici</a></a>

            </div>

        </div>

    </div>

</body>

<script src="../socket.io/socket.io.js"></script>
<script>
    const socket = io();
</script>
<script src="../assets/js/authMan.js"></script>

</html>
